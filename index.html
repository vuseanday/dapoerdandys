</head>
<body class="bg-gray-50 text-gray-900 selection:bg-orange-200 transition-colors duration-300 dark:bg-gray-950 dark:text-gray-100 dark:selection:bg-orange-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ICON COMPONENTS ---
        const IconWrapper = ({ children, className, size = 24, ...props }) => (

        );
        // Icons
        const ShoppingCart = (p) => <IconWrapper {...p}><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></IconWrapper>;
        const Star = (p) => <IconWrapper {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></IconWrapper>;
        const Phone = (p) => <IconWrapper {...p}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></IconWrapper>;

        const Minus = (p) => <IconWrapper {...p}><line x1="5" y1="12" x2="19" y2="12"/></IconWrapper>;

        const ArrowUp = (p) => <IconWrapper {...p}><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></IconWrapper>;

        // --- CONSTANTS & DATA ---
        const LOGO_URL = "logo.png"; 
        const BUNDA_IMG_URL = "ChatGPT Image Jan 2, 2026, 08_28_29 PM.jpg";
        const PHONE_NUMBER = "62895370445607"; 
        const PHONE_NUMBER_2 = "6282194295853"; 
        const PHONE_DISPLAY = "+62 895-3704-45607";
        const PHONE_DISPLAY_2 = "+62 821-9429-5853"; 
        const ADDRESS = "Mutiara Zahrah B/01, Desa Taeng, Kec. Pallangga Kab. Gowa";
        const INSTAGRAM_URL = "https://www.instagram.com/dapoerdandys";
        const FACEBOOK_URL = "https://www.facebook.com/dapoerdandys.dapoerdandys";
        const GOOGLE_MAPS_URL = "https://www.google.com/maps/search/?api=1&query=Mutiara+Zahrah+B%2F01%2C+Desa+Taeng%2C+Kec.+Pallangga+Kab.+Gowa";

        // POS LOGIC DATA
        const TIER_INDEX = { 'ECER': 0, 'RESELER': 1, 'AGEN': 2, 'DIST': 3 };

        // CLASSIC
        const CLASSIC_SIZES = ['250GR', '500GR'];
        const CLASSIC_PRICES = {

          'DEFAULT': { '250GR': [40000, 31500, 29750, 28000], '500GR': [70000, 62000, 59500, 56000] }
        };
        const CLASSIC_PRODUCTS = [
          "NASTAR", "KASTANGEL", "OREO", "CHOCOFLAKES", "CHOCOMENTE", "ALMOND CHOCO", 
          "CHOCO STIK", "SAGUKEJU", "STIKCOOKIES", "PUTRI SALJU", "CHOCOCRUNCH", 
          "CHOCOCHEESE", "BENG2 OVALTIN", "PALMCHEESE", "THUMPRINT CHOCO", 
          "THUMPRINT CHEESE", "KARIBE", "CHOCODOLLAR", "RAMBUTAN", "NESCAFE", 
          "CORNFLAKES", "BROWNIS", "LIDAH KUCING"
        ];

        // PREMIUM
        const PREMIUM_SIZES = ['400ML', '600ML', '800ML', '1000ML'];
        const PREMIUM_PRICES = {
          'NASTAR': {
            '400ML': [47000, 42300, 39950, 37600],
            '600ML': [65000, 58500, 55250, 52000],
            '800ML': [95000, 85500, 80750, 76000],
            '1000ML': [120000, 108000, 102000, 96000]
          },
          'DEFAULT_A': { // Kastangel, Chocoflakes, Kokocrunch
            '400ML': [45000, 40500, 38250, 36000],
            '600ML': [65000, 58500, 55250, 52000],
            '800ML': [90000, 81000, 76500, 72000],
            '1000ML': [115000, 103500, 97750, 92000]
          },
          'DEFAULT_B': { // Oreo, Chocomente, dll
            '400ML': [45000, 40500, 38250, 36000],
            '600ML': [85000, 76500, 72250, 68000],
            '800ML': [90000, 81000, 76500, 72000],
            '1000ML': [115000, 103500, 97750, 92000] 
          }
        };
        const PREMIUM_PRODUCTS_A = ["KASTANGEL", "CHOCOFLAKES", "KOKOCRUNCH"];
        const PREMIUM_PRODUCTS_B = ["OREO", "CHOCOMENTE", "CHOCO STIK", "SAGUKEJU", "PUTRI SALJU", "CHOCOCHEESE", "PALMCHEESE", "THUMPRINT CHOCO", "CHOCOCHIP", "CHOCODOLLAR", "LIDAH KUCING CHOKELAT", "ALMON CRISPY"];
        const PREMIUM_PRODUCTS = ["NASTAR", ...PREMIUM_PRODUCTS_A, ...PREMIUM_PRODUCTS_B];

        // SULTAN
        const SULTAN_SIZES = ['400ML', '600ML', '800ML', '1000ML'];
        const SULTAN_PRICES = {
          'DEFAULT_A': { // Nastar, Kastangel
            '400ML': [60000, 54000, 51000, 48000],
            '600ML': [85000, 76500, 72250, 68000],
            '800ML': [115000, 103500, 97750, 92000],
            '1000ML': [140000, 126000, 119000, 112000]
          },
          'DEFAULT_B': { // Sulthana, Kenari, dll
            '400ML': [65000, 58500, 55250, 52000],
            '600ML': [90000, 81000, 76500, 72000],
            '800ML': [120000, 108000, 102000, 96000],
            '1000ML': [145000, 130500, 123250, 116000]
          },
          'PISTACIO': {
            '400ML': [75000, 67500, 63750, 60000],
            '600ML': [100000, 90000, 85000, 80000],
            '800ML': [135000, 121500, 114750, 108000],
            '1000ML': [160000, 144000, 136000, 128000]
          },
          'DEFAULT_C': { // Lotus, Tosca
            '400ML': [60000, 54000, 51000, 48000],
            '600ML': [80000, 72000, 68000, 64000],
            '800ML': [110000, 99000, 93500, 88000],
            '1000ML': [135000, 121500, 114750, 108000]
          }
        };
        const SULTAN_PRODUCTS_A = ["NASTAR SULTAN", "NASTAR DURIAN", "KASTANGEL EDAM"];
        const SULTAN_PRODUCTS_B = ["SULTHANA", "KENARI CURAH", "NUTELA FLAKES", "NUTBALL", "ROCHER COOKIES"];

        const SULTAN_PRODUCTS = [...SULTAN_PRODUCTS_A, ...SULTAN_PRODUCTS_B, "PISTACIO COOKIES", ...SULTAN_PRODUCTS_C];

        // Format Currency
        const formatRupiah = (number) => {
          return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        };

        const getPrice = (tier, category, product, size) => {
          const tierIdx = TIER_INDEX[tier] || 0;
          try {
            if (category === 'CLASSIC') {
              const catData = CLASSIC_PRICES[product] || CLASSIC_PRICES['DEFAULT'];
              return catData[size][tierIdx] || 0;
            }
            if (category === 'PREMIUM') {
              let catData = PREMIUM_PRICES['DEFAULT_B'];
              if (product === 'NASTAR') catData = PREMIUM_PRICES['NASTAR'];
              else if (PREMIUM_PRODUCTS_A.includes(product)) catData = PREMIUM_PRICES['DEFAULT_A'];
              return catData[size][tierIdx] || 0;
            }
            if (category === 'SULTAN') {
              let catData = SULTAN_PRICES['DEFAULT_A'];
              if (SULTAN_PRODUCTS_B.includes(product)) catData = SULTAN_PRICES['DEFAULT_B'];
              else if (product === 'PISTACIO COOKIES') catData = SULTAN_PRICES['PISTACIO'];
              else if (SULTAN_PRODUCTS_C.includes(product)) catData = SULTAN_PRICES['DEFAULT_C'];
              return catData[size][tierIdx] || 0;
            }
          } catch (e) {
            return 0; 
          }
          return 0;
        };

        // --- HELPER COMPONENTS ---
        const ImageWithFallback = ({ src, alt, className, icon: Icon = ChefHat, onClick }) => {
            const [error, setError] = useState(false);
            if (error) {
                return (
                    <div onClick={onClick} className={`${className} bg-orange-50 dark:bg-gray-800 flex flex-col items-center justify-center text-orange-400 border-2 border-orange-100 dark:border-gray-700 border-dashed cursor-pointer`}>

                        <span className="text-xs text-center px-4 font-medium text-orange-300">{alt}</span>
                    </div>
                );
            }
            return <img src={src} alt={alt} className={className} onError={() => setError(true)} onClick={onClick} />;
        };

        const LoadingScreen = () => (
            <div className="fixed inset-0 z-[100] bg-orange-50 dark:bg-gray-900 flex flex-col items-center justify-center text-orange-600 transition-opacity duration-500">

                <p className="text-sm mt-2 text-orange-400">Memanaskan oven...</p>
            </div>
        );

            { q: "Apa saja pilihan ukuran toples yang tersedia?", a: "Untuk edisi Classic (Eco) tersedia ukuran 250gr dan 500gr. Sedangkan untuk edisi Premium dan Sultan tersedia 4 ukuran toples fleksibel: 400ml, 600ml, 800ml, dan paling besar 1000ml." },
            { q: "Apakah kue keringnya selalu ready stock?", a: "Untuk menjaga kualitas agar selalu 'Fresh From Oven', kami menerapkan sistem Pre-Order (PO). Kue dibuat setelah pesanan dan pembayaran lunas masuk." },
            { q: "Tahan berapa lama kuenya?", a: "Kue kering kami tahan hingga 2-3 bulan dalam suhu ruang dengan kondisi toples tertutup rapat, karena kami tidak menggunakan bahan pengawet sama sekali." },
            { q: "Bisa kirim ke luar kota Makassar/Gowa?", a: "Tentu bisa! Kami packing ekstra aman menggunakan bubble wrap berlapis dan kardus kokoh agar kue tidak hancur selama perjalanan di ekspedisi." },
            { q: "Apakah ada harga khusus untuk agen / reseller?", a: "Ya! Kami melayani sistem keagenan, reseller, hingga distributor dengan potongan harga (Rate Harga) yang sangat menarik. Hubungi admin via WhatsApp untuk detail pendaftarannya." },
        ];

        const TESTIMONIALS = [
            { name: "Ibu Rina, Makassar", text: "Sumpah Nastar Sultannya lumer banget di mulut! Selai nanasnya kerasa bikin sendiri bukan yang kiloan. Bakal repeat order buat lebaran besok.", role: "Pelanggan Setia" },
            { name: "Mbak Tari, Gowa", text: "Pesan hampers Premium buat dikirim ke mertua, packingnya cantik dan aman banget. Mertua seneng banget pas nyobain putri saljunya.", role: "Pembeli Hampers" },
            { name: "Sari, Pallangga", text: "Kastangel Edam-nya ngejuuu pol! Anak saya suka banget sampe rebutan. Harganya sepadan banget sama rasa full butter-nya yang mewah.", role: "Penikmat Keju" },
        ];

        // --- SUB-COMPONENTS ---
        const Navbar = ({ cartCount, toggleCart, isDarkMode, toggleDarkMode }) => {
            const [isScrolled, setIsScrolled] = useState(false);
            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed top-0 left-0 right-0 z-40 transition-all duration-300 ${isScrolled ? 'bg-white/95 dark:bg-gray-900/95 backdrop-blur-md shadow-sm py-4' : 'bg-transparent py-6'}`}>
                    <div className="container mx-auto px-6 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-white dark:bg-gray-800 shadow-md flex items-center justify-center overflow-hidden border border-orange-100 dark:border-gray-700">

        const Hero = () => (

                                    <a href={INSTAGRAM_URL} target="_blank" rel="noreferrer" className="flex items-center gap-4 hover:text-orange-300 transition-colors">
                                        <Instagram className="w-5 h-5 text-orange-500" /><span>@dapoerdandys</span>
                                    </a>
                                </li>
                                <li className="flex items-center gap-4">
                                    <a href={FACEBOOK_URL} target="_blank" rel="noreferrer" className="flex items-center gap-4 hover:text-orange-300 transition-colors">
                                        <Facebook className="w-5 h-5 text-orange-500" /><span>@Dapoer Dandys</span>
                                    </a>
                                </li>
                                <li className="flex items-start gap-4">
                                    <a href={GOOGLE_MAPS_URL} target="_blank" rel="noreferrer" className="flex items-start gap-4 hover:text-orange-300 transition-colors group">
                                        <MapPin className="w-5 h-5 text-orange-500 mt-1" /><span>{ADDRESS}</span>
                                    </a>
                                </li>
                            </ul>
                        </div>
                        <div className="md:col-span-3">
                            <h4 className="text-lg font-bold mb-8 text-white">Waktu Operasional</h4>
                            <div className="space-y-4 text-gray-400">
                                <div className="flex justify-between border-b border-gray-800 pb-2"><span>Senin - Jumat</span><span className="font-medium text-white">08:00 - 17:00</span></div>
                                <div className="flex justify-between border-b border-gray-800 pb-2"><span>Sabtu</span><span className="font-medium text-white">08:00 - 15:00</span></div>
                                <div className="flex justify-between"><span>Minggu</span><span className="text-orange-500 font-medium">Pre-Order Only</span></div>
                            </div>
                        </div>
                    </div>
                    <div className="border-t border-gray-800 pt-8 text-center text-gray-600 text-sm">&copy; {new Date().getFullYear()} Dapoerdandys. Made with love in Gowa. | Made by <a href="https://vuseanday.github.io/website/" target="_blank" rel="noreferrer" className="hover:text-orange-500 transition-colors font-semibold">Vuseanday Services</a></div>
                </div>
            </footer>
        );

        const FloatingWhatsApp = () => (
            <a href={`https://wa.me/${PHONE_NUMBER}`} target="_blank" rel="noreferrer" className="fixed bottom-6 right-6 bg-green-500 hover:bg-green-600 text-white p-4 rounded-full shadow-2xl z-40 transition-transform hover:scale-110 flex items-center gap-2 group">
                <MessageCircle size={24} className="fill-white text-green-500" />
                <span className="max-w-0 overflow-hidden group-hover:max-w-xs transition-all duration-500 whitespace-nowrap font-bold">Chat Bunda</span>
            </a>
        );

        // --- MAIN APP ---
        const App = () => {
            const [isLoading, setIsLoading] = useState(true);
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [showBackToTop, setShowBackToTop] = useState(false);

            useEffect(() => {
                // Simulate Loading
                setTimeout(() => setIsLoading(false), 1500);
                
                // Back to Top Listener
                const handleScroll = () => setShowBackToTop(window.scrollY > 400);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            useEffect(() => {
                // Apply Dark Mode
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            const addToCart = (item) => {
                setCart(prev => {
                    const existing = prev.find(i => i.product === item.product && i.size === item.size && i.category === item.category);
                    if(existing) {
                        return prev.map(i => i.id === existing.id ? { ...i, qty: i.qty + item.qty } : i);
                    }
                    return [...prev, item];
                });
                setIsCartOpen(true);
            };

            const removeFromCart = (id) => setCart(prev => prev.filter(i => i.id !== id));
            const updateQty = (id, delta) => setCart(prev => prev.map(i => i.id === id ? { ...i, qty: Math.max(1, i.qty + delta) } : i));
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);

            const handleCheckout = () => {
                const header = `Halo Dandys Cookies (Gowa), saya ingin memesan Kue Kering:%0A%0A`;
                const items = cart.map((item, idx) => `${idx + 1}. ${item.product} (${item.size}) - ${item.qty}x = Rp ${(item.price * item.qty).toLocaleString('id-ID')}`).join('%0A');
                const footer = `%0A%0ATotal Estimasi Harga Ecer: Rp ${totalPrice.toLocaleString('id-ID')}%0A%0AMohon diinfokan untuk total jika ada Rate Mitra atau ongkos kirim. Terima kasih!`;
                window.open(`https://wa.me/${PHONE_NUMBER}?text=${header}${items}${footer}`, '_blank');
            };

            const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

            if (isLoading) return <LoadingScreen />;

            return (
                <div className="min-h-screen font-sans">
                    <Navbar cartCount={totalItems} toggleCart={() => setIsCartOpen(true)} isDarkMode={isDarkMode} toggleDarkMode={() => setIsDarkMode(!isDarkMode)} />
                    <Hero />
                    <StatsSection />
                    <Features />
                    <CatalogOrderSection addToCart={addToCart} />
                    <HowToOrder />
                    <Testimonials />
                    <FAQ />
                    <Footer />
                    <FloatingWhatsApp />
                    
                    {/* Back to Top Button */}
                    <button 
                        onClick={scrollToTop} 
                        className={`fixed bottom-24 right-6 bg-orange-600 text-white p-3 rounded-full shadow-lg z-30 transition-all duration-300 ${showBackToTop ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}
                    >
                        <ArrowUp size={24} />
                    </button>

                    {/* Cart Drawer */}
                    {isCartOpen && (
                        <div className="relative z-50">
                            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setIsCartOpen(false)} />
                            <div className="fixed top-0 right-0 h-full w-full md:w-[450px] bg-white dark:bg-gray-800 shadow-2xl flex flex-col transform transition-transform duration-300">
                                <div className="p-6 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center">
                                    <h2 className="text-xl font-bold flex items-center gap-2 text-gray-900 dark:text-white"><ShoppingCart className="text-orange-600" /> Keranjang Order</h2>
                                    <button onClick={() => setIsCartOpen(false)} className="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full transition-colors"><X size={20} className="text-gray-600 dark:text-gray-300" /></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-6 space-y-6">
                                    {cart.length === 0 ? (
                                        <div className="text-center text-gray-400 mt-20 flex flex-col items-center">
                                            <div className="bg-gray-100 dark:bg-gray-700 p-6 rounded-full mb-4"><ShoppingCart size={48} className="opacity-20" /></div>
                                            <p className="font-medium">Keranjang pesanan masih kosong.</p>
                                            <button onClick={() => setIsCartOpen(false)} className="mt-4 px-6 py-2 bg-orange-600 text-white rounded-full text-sm font-semibold hover:bg-orange-700 transition-colors">Lihat Katalog</button>
                                        </div>
                                    ) : (
                                        cart.map(item => (
                                            <div key={item.id} className="flex gap-4 items-center bg-white dark:bg-gray-700 p-3 rounded-2xl border border-gray-100 dark:border-gray-600 shadow-sm">
                                                <div className="w-16 h-16 rounded-xl bg-orange-100 dark:bg-gray-800 flex items-center justify-center shrink-0 border border-orange-200 dark:border-gray-600">
                                                    <span className="font-black text-orange-400 text-xs text-center">{item.category.substring(0,3)}</span>
                                                </div>
                                                <div className="flex-1">
                                                    <h4 className="font-bold text-gray-800 dark:text-white text-sm leading-tight mb-1">{item.product}</h4>
                                                    <div className="flex justify-between items-center">
                                                        <p className="text-orange-600 dark:text-orange-400 font-bold text-sm">Rp {item.price.toLocaleString('id-ID')}</p>
                                                        <span className="text-[10px] bg-gray-100 dark:bg-gray-600 px-2 py-1 rounded text-gray-600 dark:text-gray-300 font-bold">{item.size}</span>
                                                    </div>
                                                    <div className="flex items-center gap-3 mt-3">
                                                        <button onClick={() => updateQty(item.id, -1)} className="w-7 h-7 flex items-center justify-center rounded-lg bg-gray-100 dark:bg-gray-600 hover:bg-gray-200 dark:hover:bg-gray-500 transition-colors dark:text-white"><Minus size={14} /></button>
                                                        <span className="text-sm font-bold w-4 text-center dark:text-white">{item.qty}</span>
                                                        <button onClick={() => updateQty(item.id, 1)} className="w-7 h-7 flex items-center justify-center rounded-lg bg-gray-100 dark:bg-gray-600 hover:bg-gray-200 dark:hover:bg-gray-500 transition-colors dark:text-white"><Plus size={14} /></button>
                                                    </div>
                                                </div>
                                                <button onClick={() => removeFromCart(item.id)} className="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg transition-colors"><X size={18} /></button>
                                            </div>
                                        ))
                                    )}
                                </div>
                                {cart.length > 0 && (
                                    <div className="p-6 border-t border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 pb-8">
                                        <div className="flex justify-between items-center mb-6"><span className="text-gray-600 dark:text-gray-400 font-medium">Total Harga Ecer</span><span className="text-2xl font-bold text-gray-900 dark:text-white">Rp {totalPrice.toLocaleString('id-ID')}</span></div>
                                        <button onClick={handleCheckout} className="w-full py-4 bg-green-600 text-white rounded-xl font-bold hover:bg-green-700 transition-all flex items-center justify-center gap-3 shadow-lg shadow-green-600/20 active:scale-95"><Phone size={20} /> Checkout ke WhatsApp Admin</button>
                                        <p className="text-xs text-center text-gray-500 dark:text-gray-400 mt-4 leading-relaxed">Punya rate mitra? Totalnya akan disesuaikan saat rekap via WhatsApp.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
